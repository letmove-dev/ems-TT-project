<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วงล้อสายเมา 🍻</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Kanit', Tahoma, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #111d13, #385e38, #1b2a1c);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .card {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            margin: 0 0 15px 0;
            font-size: 1.8rem;
            color: #ffcc00;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto 20px auto;
        }
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 30px solid #ff4757;
            z-index: 10;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.8));
        }
        canvas {
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
            transition: transform 4s cubic-bezier(0.15, 0.99, 0.35, 1);
        }
        .result-box {
            background: #fff;
            color: #111;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: 800;
            min-height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 2px solid #ffcc00;
        }
        .btn-spin {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            width: 100%;
            transition: 0.2s;
        }
        .btn-spin:active {
            transform: scale(0.95);
        }
        .btn-spin:disabled {
            background: #666;
            cursor: not-allowed;
            box-shadow: none;
        }
        .settings {
            margin-top: 20px;
            text-align: left;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 15px;
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            outline: none;
        }
        .btn-add {
            background: #2ed573;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        ul {
            list-style: none;
            padding: 0;
            max-height: 120px;
            overflow-y: auto;
            margin: 0;
        }
        li {
            background: rgba(255,255,255,0.1);
            margin: 4px 0;
            padding: 6px 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        .btn-del {
            background: #ff6b81;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            padding: 2px 6px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🎡 วงล้อสายเมา 🍺</h1>
    
    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="320" height="320"></canvas>
    </div>

    <div class="result-box" id="resultText">
        กดปุ่มหมุนวงล้อเพื่อเริ่มสนุก!
    </div>

    <button class="btn-spin" id="spinBtn" onclick="spinWheel()">🔥 หมุนวงล้อ!</button>

    <div class="settings">
        <span style="font-size: 0.9rem; font-weight: bold;">⚙️ เพิ่ม/ลบ ตัวเลือก:</span>
        <div class="input-group" style="margin-top: 5px;">
            <input type="text" id="customInput" placeholder="พิมพ์คำสั่งใหม่...">
            <button class="btn-add" onclick="addItem()">เพิ่ม</button>
        </div>
        <ul id="itemList"></ul>
    </div>
</div>

<script>
    // ตัวแปรเก็บข้อมูลหลัก (ถ้าอยากตั้งค่าเริ่มต้นถาวร แก้ไขข้อความใน Array นี้ได้เลย)
    let defaultItems = [
        "หมดแก้ว!",
        "ยกรวดเดียว 2 อึก",
        "คนซ้ายมือดื่ม",
        "คนขวามือดื่ม",
        "รอดตัวไป!",
        "ชี้คนเจ้าชู้กิน 1 อึก",
        "เป็นราชาสั่งใครก็ยอม",
        "จ้องตากับคนตรงข้าม 5 วิ"
    ];

    const colors = ['#ff4757', '#2ed573', '#ffa502', '#1e90ff', '#9b59b6', '#ff6b81', '#3742fa', '#eccc68'];

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const resultText = document.getElementById('resultText');
    const spinBtn = document.getElementById('spinBtn');
    
    let currentRotation = 0;
    let isSpinning = false;

    // วาดวงล้อจากข้อมูลในตัวแปร defaultItems
    function drawWheel() {
        const numSegments = defaultItems.length;
        const radius = canvas.width / 2;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (numSegments === 0) return;

        const anglePerSegment = (2 * Math.PI) / numSegments;

        for (let i = 0; i < numSegments; i++) {
            const startAngle = i * anglePerSegment - (Math.PI / 2);
            const endAngle = startAngle + anglePerSegment;

            ctx.beginPath();
            ctx.moveTo(radius, radius);
            ctx.arc(radius, radius, radius, startAngle, endAngle);
            ctx.closePath();
            ctx.fillStyle = colors[i % colors.length];
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(startAngle + anglePerSegment / 2);
            ctx.textAlign = "right";
            ctx.font = "900 16px 'Kanit', sans-serif";
            
            let text = defaultItems[i];
            if (text.length > 12) text = text.substring(0, 10) + "..";
            
            ctx.strokeStyle = "black";
            ctx.lineWidth = 4;
            ctx.strokeText(text, radius - 20, 6);
            
            ctx.fillStyle = "#ffffff";
            ctx.fillText(text, radius - 20, 6);
            
            ctx.restore();
        }
    }

    function spinWheel() {
        if (isSpinning || defaultItems.length === 0) return;

        isSpinning = true;
        spinBtn.disabled = true;
        resultText.innerText = "กำลังสุ่มดวง...";

        const numSegments = defaultItems.length;
        const segmentAngle = 360 / numSegments;
        
        const winningIndex = Math.floor(Math.random() * numSegments);
        const targetAngle = 360 - (winningIndex * segmentAngle) - (segmentAngle / 2);
        const totalSpinDegrees = 1800 + targetAngle;

        currentRotation += totalSpinDegrees - (currentRotation % 360);
        canvas.style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            isSpinning = false;
            spinBtn.disabled = false;
            resultText.innerText = defaultItems[winningIndex];
            
            resultText.style.transform = "scale(1.08)";
            setTimeout(() => resultText.style.transform = "scale(1)", 200);
        }, 4000);
    }

    function renderList() {
        const itemList = document.getElementById('itemList');
        itemList.innerHTML = '';
        defaultItems.forEach((item, index) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <span>${item}</span>
                <button class="btn-del" onclick="deleteItem(${index})">ลบ</button>
            `;
            itemList.appendChild(li);
        });
        drawWheel();
    }

    // Insert (push) ข้อมูลใหม่เข้าตัวแปร defaultItems ตรงๆ
    function addItem() {
        const input = document.getElementById('customInput');
        const text = input.value.trim();
        if (text) {
            defaultItems.push(text); // ยัดข้อมูลเข้า Array defaultItems
            input.value = '';
            renderList();
        }
    }

    // ลบข้อมูลออกจากตัวแปร defaultItems ตรงๆ
    function deleteItem(index) {
        defaultItems.splice(index, 1);
        renderList();
    }

    renderList();
</script>

</body>
</html>
